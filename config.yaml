channels:
  - name: "Sains & Pengetahuan"
    niche: "fakta sains dan pengetahuan umum yang mengejutkan (alam semesta, tubuh manusia, sejarah, hewan, teknologi)"
    audience: "orang dewasa Indonesia yang penasaran dan suka belajar hal baru"
    language: id
  - name: "Kisah Nyata"
    niche: "kisah nyata tragis, misteri belum terpecahkan, dan kejadian aneh di dunia"
    audience: "orang dewasa yang menyukai misteri dan true crime"
    language: id
  - name: "Fakta Anime"
    niche: "fakta unik tersembunyi tentang dunia anime populer dan budaya otaku"
    audience: "wibu dan pecinta anime di Indonesia"
    language: id
  - name: "Web & AI"
    niche: "website rahasia, tools AI gratis, dan tips teknologi untuk produktivitas"
    audience: "pelajar dan pekerja remote yang suka teknologi"
    language: id
  - name: "Horor & Urban Legend"
    niche: "urban legend menakutkan, mitos mistis lokal, dan cerita hantu"
    audience: "remaja dan dewasa yang menyukai konten horor"
    language: id
  - name: "Fakta Negara"
    niche: "fakta aneh dan budaya unik dari berbagai negara di seluruh dunia"
    audience: "orang yang suka traveling dan wawasan global"
    language: id
  - name: "Life Hacks"
    niche: "life hacks aneh tapi nyata dan tips bertahan hidup yang berguna"
    audience: "semua kalangan umur"
    language: id
  - name: "Fakta Psikologi"
    niche: "fakta psikologi tentang cinta, sifat manusia, dan kepribadian"
    audience: "remaja dan dewasa muda"
    language: id

script:
  model: gemini-2.5-flash
  target_seconds: 80
  words_per_second: 2.5

voice:
  provider: edge
  elevenlabs_model: eleven_multilingual_v2
  variety:
    enabled: true
    voices:
      - edge_id: "id-ID-ArdiNeural"
        elevenlabs_id: "VR6AewLTigWG4xSOukaG"
        name: "Arnold"
        gender: "male"
      - edge_id: "id-ID-ArdiNeural"
        elevenlabs_id: "ErXwobaYiN019PkySvjV"
        name: "Jaka"
        gender: "male"
    strategy: "round_robin"
  voice: id-ID-ArdiNeural
  elevenlabs_voice_id: VR6AewLTigWG4xSOukaG

captions:
  whisper_model: base
  font: "Anton"
  font_size: 90
  primary_color: "&H0000FFFF"
  outline_color: "&H00000000"
  outline: 6
  words_per_caption: 1
  position_y: 0.55

video:
  width: 1080
  height: 1920
  fps: 30

upload:
  youtube_enabled: false
  privacy: "public"
  category_id: "27"
  made_for_kids: false
  channel: "default"
  default_tags: ["fakta unik", "pengetahuan", "edukasi", "fakta sains", "alam liar", "hewan unik", "fakta menarik", "sains viral", "fakta"]
  schedule:
    enabled: true
    optimal_hours: [11, 13, 17, 19, 21]
    max_per_day: 2
    delay_minutes: 120
  tiktok:
    enabled: true

branding:
  enabled: true
  intro:
    enabled: false
    path: "assets/branding/intro.mp4"
    duration: 2.5
  outro:
    enabled: false
    path: "assets/branding/outro.mp4"
    duration: 3.0
    cta_text: "Subscribe untuk fakta unik lainnya!"
  watermark:
    enabled: true
    path: "assets/branding/watermark.png"
    position: "center"
    opacity: 0.6
    size: 300
hook_text:
  enabled: true
  font: "Anton"
  font_size: 90
  color: "white"
  outline_color: "&H00000000"
  outline: 4
  position: "center"
  duration: 3
